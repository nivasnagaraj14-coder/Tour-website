<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Itineraries – Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #C9A84C; --dark: #0D0D0D; --dark2: #1A1A1A; --cream: #F5F0E8; --text-muted: #777; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Jost', sans-serif; background: var(--dark); color: var(--cream); display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: var(--dark2); border-right: 1px solid rgba(255,255,255,0.06); padding: 30px 0; flex-shrink: 0; }
        .sidebar-logo { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--gold); padding: 0 24px 30px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .sidebar-logo small { display: block; font-family: 'Jost', sans-serif; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 14px 24px; text-decoration: none; color: var(--text-muted); font-size: 0.88rem; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { color: var(--cream); background: rgba(255,255,255,0.04); border-left: 2px solid var(--gold); }
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-title { font-family: 'Playfair Display', serif; font-size: 2rem; }
        .btn-add { background: var(--gold); color: var(--dark); padding: 12px 24px; text-decoration: none; font-size: 0.8rem; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; border-radius: 2px; transition: all 0.3s; }
        .btn-add:hover { background: #E8C97A; }
        .alert-success { background: rgba(40,167,69,0.15); border: 1px solid rgba(40,167,69,0.3); color: #5cb85c; padding: 12px 16px; border-radius: 2px; margin-bottom: 20px; font-size: 0.9rem; }
        table { width: 100%; border-collapse: collapse; background: var(--dark2); }
        th { text-align: left; padding: 12px 16px; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02); }
        td { padding: 14px 16px; font-size: 0.88rem; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .type-badge { padding: 3px 10px; font-size: 0.65rem; letter-spacing: 1.5px; text-transform: uppercase; border-radius: 2px; }
        .DOMESTIC { background: rgba(40,167,69,0.15); color: #5cb85c; }
        .INTERNATIONAL { background: rgba(201,168,76,0.15); color: var(--gold); }
        .inactive-row td { opacity: 0.4; }
        .action-btns { display: flex; gap: 8px; }
        .btn-edit, .btn-del { padding: 6px 14px; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; border: none; cursor: pointer; font-family: 'Jost', sans-serif; border-radius: 2px; text-decoration: none; }
        .btn-edit { background: rgba(255,255,255,0.08); color: var(--cream); }
        .btn-edit:hover { background: rgba(255,255,255,0.15); }
        .btn-del { background: rgba(220,53,69,0.15); color: #dc3545; }
        .btn-del:hover { background: rgba(220,53,69,0.3); }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">SimplyTours!<small>Admin Panel</small></div>
    <a href="/admin/dashboard" class="nav-item"><span>🏠</span> Dashboard</a>
    <a href="/admin/itineraries" class="nav-item active"><span>🗺</span> Itineraries</a>
    <a href="/admin/bookings" class="nav-item"><span>📋</span> Bookings</a>
    <a href="/" class="nav-item" target="_blank"><span>🌐</span> View Website</a>
</div>
<div class="main">
    <div class="page-header">
        <h1 class="page-title">Tour Itineraries</h1>
        <a href="/admin/itineraries/new" class="btn-add">+ Add New Tour</a>
    </div>
    <div class="alert-success" th:if="${message}" th:text="${message}"></div>
    <table>
        <thead><tr><th>Title</th><th>Destination</th><th>Type</th><th>Duration</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
            <tr th:each="it : ${itineraries}" th:classappend="${!it.active} ? 'inactive-row'">
                <td th:text="${it.title}">Title</td>
                <td th:text="${it.destination}">Dest</td>
                <td><span class="type-badge" th:classappend="${it.tourType}" th:text="${it.tourType}"></span></td>
                <td th:text="${it.duration} + 'D'">7D</td>
                <td th:text="'₹' + ${it.price}">₹25000</td>
                <td th:text="${it.active ? 'Active' : 'Hidden'}" th:style="${it.active ? 'color:#5cb85c' : 'color:var(--text-muted)'}">Active</td>
                <td>
                    <div class="action-btns">
                        <a th:href="@{/admin/itineraries/edit/{id}(id=${it.id})}" class="btn-edit">Edit</a>
                        <form th:action="@{/admin/itineraries/delete/{id}(id=${it.id})}" method="post" onsubmit="return confirm('Remove this tour?')">
                            <button type="submit" class="btn-del">Remove</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
