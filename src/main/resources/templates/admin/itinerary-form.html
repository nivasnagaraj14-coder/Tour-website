<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title th:text="${isNew} ? 'New Tour' : 'Edit Tour'">Tour Form – Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #C9A84C; --dark: #0D0D0D; --dark2: #1A1A1A; --cream: #F5F0E8; --text-muted: #777; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Jost', sans-serif; background: var(--dark); color: var(--cream); display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: var(--dark2); border-right: 1px solid rgba(255,255,255,0.06); padding: 30px 0; flex-shrink: 0; }
        .sidebar-logo { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--gold); padding: 0 24px 30px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .sidebar-logo small { display: block; font-family: 'Jost', sans-serif; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 14px 24px; text-decoration: none; color: var(--text-muted); font-size: 0.88rem; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { color: var(--cream); background: rgba(255,255,255,0.04); border-left: 2px solid var(--gold); }
        .main { flex: 1; padding: 40px; overflow-y: auto; max-width: 900px; }
        .page-title { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 30px; }
        .form-card { background: var(--dark2); border: 1px solid rgba(255,255,255,0.06); padding: 36px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-full { grid-column: 1 / -1; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.72rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
        input, select, textarea { background: var(--dark); border: 1px solid rgba(255,255,255,0.1); color: var(--cream); padding: 12px 14px; font-family: 'Jost', sans-serif; font-size: 0.9rem; border-radius: 2px; transition: border-color 0.3s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
        select option { background: var(--dark2); }
        textarea { min-height: 100px; resize: vertical; }
        .hint { font-size: 0.75rem; color: var(--text-muted); }
        .btn-row { display: flex; gap: 12px; margin-top: 24px; }
        .btn-save { background: var(--gold); color: var(--dark); border: none; padding: 14px 32px; font-family: 'Jost', sans-serif; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; cursor: pointer; border-radius: 2px; transition: all 0.3s; }
        .btn-save:hover { background: #E8C97A; }
        .btn-cancel { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: var(--cream); padding: 14px 24px; text-decoration: none; font-size: 0.8rem; letter-spacing: 1.5px; text-transform: uppercase; border-radius: 2px; transition: all 0.3s; }
        .btn-cancel:hover { border-color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">WanderLux<small>Admin Panel</small></div>
    <a href="/admin/dashboard" class="nav-item"><span>🏠</span> Dashboard</a>
    <a href="/admin/itineraries" class="nav-item active"><span>🗺</span> Itineraries</a>
    <a href="/admin/bookings" class="nav-item"><span>📋</span> Bookings</a>
    <a href="/" class="nav-item" target="_blank"><span>🌐</span> View Website</a>
</div>
<div class="main">
    <h1 class="page-title" th:text="${isNew} ? 'Add New Tour' : 'Edit Tour'">Tour Form</h1>
    <div class="form-card">
        <form th:action="@{/admin/itineraries/save}" method="post" th:object="${itinerary}">
            <input type="hidden" th:field="*{id}">
            <div class="form-grid">
                <div class="form-group form-full">
                    <label>Tour Title *</label>
                    <input type="text" th:field="*{title}" placeholder="e.g. Golden Triangle India" required>
                </div>
                <div class="form-group">
                    <label>Destination *</label>
                    <input type="text" th:field="*{destination}" placeholder="e.g. Delhi – Agra – Jaipur" required>
                </div>
                <div class="form-group">
                    <label>Tour Type *</label>
                    <select th:field="*{tourType}" required>
                        <option value="">Select type...</option>
                        <option value="DOMESTIC">🇮🇳 Domestic</option>
                        <option value="INTERNATIONAL">✈ International</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Duration (days) *</label>
                    <input type="number" th:field="*{duration}" min="1" max="30" required>
                </div>
                <div class="form-group">
                    <label>Price per Person (₹) *</label>
                    <input type="number" th:field="*{price}" min="0" required>
                </div>
                <div class="form-group form-full">
                    <label>Cover Image URL</label>
                    <input type="url" th:field="*{imageUrl}" placeholder="https://images.unsplash.com/...">
                    <span class="hint">Use Unsplash or any public image URL</span>
                </div>
                <div class="form-group form-full">
                    <label>Description *</label>
                    <textarea th:field="*{description}" placeholder="Describe this tour..." required></textarea>
                </div>
                <div class="form-group form-full">
                    <label>Highlights (comma-separated)</label>
                    <input type="text" name="highlightsStr"
                           th:value="${itinerary.highlights != null ? #strings.listJoin(itinerary.highlights, ', ') : ''}"
                           placeholder="Taj Mahal Sunrise, Amber Fort, Local Market">
                    <span class="hint">Enter highlights separated by commas</span>
                </div>
                <div class="form-group form-full">
                    <label>Active</label>
                    <select th:field="*{active}">
                        <option value="true">Yes – Show on website</option>
                        <option value="false">No – Hide from website</option>
                    </select>
                </div>
            </div>
            <div class="btn-row">
                <button type="submit" class="btn-save">Save Tour</button>
                <a href="/admin/itineraries" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script>
// Convert comma-separated highlights to list before submit
document.querySelector('form').addEventListener('submit', function(e) {
    // The server-side controller handles this via @RequestParam if needed
    // For now the form sends highlightsStr and we handle it in controller
});
</script>
</body>
</html>
